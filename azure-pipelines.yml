            displayName: "Validation Helm PROD"

          - bash: |
              set -euo pipefail
              set -x

              helm upgrade \
                --install \
                "$(releaseName)" \
                "$(helmChartPath)" \
                --namespace "$(namespace)" \
                --create-namespace \
                -f "$(helmChartPath)/values.yaml" \
                -f "$(helmChartPath)/$(valuesFile)" \
                --set fullnameOverride="$(workloadName)" \
                --set image.repository="$(acrLoginServer)/$(acrRepository)" \
                --set image.tag="$(imageTag)" \
                --set-string env.azureOpenAIEndpoint="$(azureOpenAIEndpoint)" \
                --set-string env.azureOpenAIDeployment="$(azureOpenAIDeployment)" \
                --set-string env.azureOpenAIApiVersion="$(azureOpenAIApiVersion)" \
                --set-file secret.azureOpenAIApiKey="$(azureOpenAIApiKeyFile)" \
                --wait \
