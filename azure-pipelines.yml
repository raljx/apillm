                "$(helmChartPath)" \
                --namespace "$(namespace)" \
                -f "$(helmChartPath)/values.yaml" \
                -f "$(helmChartPath)/$(valuesFile)" \
                --set fullnameOverride="$(workloadName)" \
                --set image.repository="$(acrLoginServer)/$(acrRepository)" \
                --set image.tag="$(imageTag)" \
                --set-string env.azureOpenAIEndpoint="$(azureOpenAIEndpoint)" \
                --set-string env.azureOpenAIDeployment="$(azureOpenAIDeployment)" \
                --set-string env.azureOpenAIApiVersion="$(azureOpenAIApiVersion)" \
                --set-file secret.azureOpenAIApiKey="$(azureOpenAIApiKeyFile)" \
                --debug > rendered-prp.yaml

              test -s rendered-prp.yaml

            displayName: "Validation Helm PRP"

          - bash: |
              set -euo pipefail
              set -x

              helm upgrade \
                --install \
                "$(releaseName)" \
                "$(helmChartPath)" \
                --namespace "$(namespace)" \
                --create-namespace \
                -f "$(helmChartPath)/values.yaml" \
                -f "$(helmChartPath)/$(valuesFile)" \
                --set fullnameOverride="$(workloadName)" \
                --set image.repository="$(acrLoginServer)/$(acrRepository)" \
                --set image.tag="$(imageTag)" \
                --set-string env.azureOpenAIEndpoint="$(azureOpenAIEndpoint)" \
                --set-string env.azureOpenAIDeployment="$(azureOpenAIDeployment)" \
                --set-string env.azureOpenAIApiVersion="$(azureOpenAIApiVersion)" \
                --set-file secret.azureOpenAIApiKey="$(azureOpenAIApiKeyFile)" \
                --wait \
                --timeout 10m \
                --atomic \
                --debug

            displayName: "Déploiement Helm PRP"

          - bash: |
              set -euo pipefail
              set -x

              helm status "$(releaseName)" -n "$(namespace)"
              kubectl get deployments -n "$(namespace)" -o wide --show-labels
              kubectl get pods -n "$(namespace)" -o wide --show-labels
              kubectl get svc -n "$(namespace)" -o wide
              kubectl get ingress -n "$(namespace)" -o wide || true
              kubectl get events -n "$(namespace)" --sort-by=.metadata.creationTimestamp

            displayName: "Vérifications PRP"

          - bash: |
              set +e

              echo "===== DIAGNOSTIC PRP ====="
              helm status "$(releaseName)" -n "$(namespace)" || true
