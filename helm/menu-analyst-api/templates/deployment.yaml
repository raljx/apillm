apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "menu-analyst-api.fullname" . }}
  labels:
    {{- include "menu-analyst-api.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      {{- include "menu-analyst-api.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "menu-analyst-api.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

    spec:
      serviceAccountName: {{ include "menu-analyst-api.serviceAccountName" . }}

      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      containers:
        - name: menu-analyst-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP

          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "menu-analyst-api.fullname" . }}
                  key: LOG_LEVEL

            - name: MAX_UPLOAD_SIZE_MB
              valueFrom:
                configMapKeyRef:
                  name: {{ include "menu-analyst-api.fullname" . }}
                  key: MAX_UPLOAD_SIZE_MB

            - name: AZURE_OPENAI_ENDPOINT
              value: {{ .Values.env.azureOpenAIEndpoint | quote }}

            - name: AZURE_OPENAI_DEPLOYMENT
              value: {{ .Values.env.azureOpenAIDeployment | quote }}

            - name: AZURE_OPENAI_API_VERSION
              value: {{ .Values.env.azureOpenAIApiVersion | quote }}

            - name: AZURE_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "menu-analyst-api.fullname" . }}-secret
                  key: AZURE_OPENAI_API_KEY

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.startupProbe.path }}
              port: http
              scheme: HTTP
            initialDelaySeconds: {{ .Values.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
            successThreshold: 1
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          {{- end }}

          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: http
              scheme: HTTP
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            successThreshold: 1
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}

          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: http
              scheme: HTTP
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            successThreshold: 1
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}