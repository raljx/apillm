apiVersion: v1
kind: Service

metadata:
  name: {{ include "menu-analyst-api.fullname" . }}
  labels:
    {{- include "menu-analyst-api.labels" . | nindent 4 }}

spec:
  type: {{ .Values.service.type }}

  selector:
    {{- include "menu-analyst-api.selectorLabels" . | nindent 4 }}

  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: http